<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Cally admin</title><style>*{box-sizing:border-box}body{background:#101010;color:#eee;font:15px Arial;margin:0}main{max-width:500px;margin:70px auto;padding:24px}h1{font-size:32px}label{display:block;margin:24px 0 8px}input,button{width:100%;padding:14px;border:1px solid #444;border-radius:8px;font:inherit}input{background:#191919;color:#fff}button{margin-top:24px;cursor:pointer}p{line-height:1.6;color:#aaa}#status{color:#eee}a{color:#ccc}</style></head><body><main><h1>Cally admin</h1><p>Update the CA shown on Cally. Changes save immediately.</p><form id="form"><label for="key">Admin key</label><input id="key" type="password" autocomplete="off" required><label for="ca">Cally contract address</label><input id="ca" placeholder="Not Announced" autocomplete="off" spellcheck="false"><p>Leave blank to show “Not Announced”.</p><button id="confirm">Confirm</button><p id="status" role="status"></p></form><a href="/">Back to Cally</a></main><script>
const key=document.getElementById('key'),ca=document.getElementById('ca'),status=document.getElementById('status'),button=document.getElementById('confirm');
fetch('/brand.json',{cache:'no-store'}).then(r=>r.json()).then(d=>ca.value=d.ca||'').catch(()=>{});
document.getElementById('form').onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent='Saving…';try{const r=await fetch('/admin/brand',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key.value},body:JSON.stringify({ca:ca.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent='Saved. Open Cally panels update within 5 seconds.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></body></html>
